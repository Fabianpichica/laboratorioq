{% extends 'adminlab/base.html' %}
{% load static %}
{% block content %}
<div class="form-card" style="max-width:480px;margin:60px auto;background:#fff;border-radius:16px;box-shadow:0 2px 16px rgba(25,118,210,0.10);padding:36px 32px 28px 32px;display:flex;flex-direction:column;align-items:center;">
    <h2 style="color:#283593;font-size:1.5rem;margin-bottom:18px;display:flex;align-items:center;gap:10px;"><i class="fa-solid fa-school"></i> {% if salon %}Editar Salón{% else %}Agregar Salón{% endif %}</h2>
    <form method="post" style="width:100%;display:flex;flex-direction:column;gap:18px;">
        {% csrf_token %}
        <div>
            <label for="nombre" style="color:#1976d2;font-weight:600;margin-bottom:4px;">Nombre</label>
            <input type="text" name="nombre" id="nombre" placeholder="Nombre del salón" value="{{ salon.nombre|default:'' }}" required style="width:100%;padding:10px 12px;border:1.5px solid #bfc8d6;border-radius:8px;font-size:1rem;background:#f7f9fc;color:#222;transition:border 0.2s;">
        </div>
        <div>
            <label for="ubicacion" style="color:#1976d2;font-weight:600;margin-bottom:4px;">Ubicación</label>
            <input type="text" name="ubicacion" id="ubicacion" placeholder="Ubicación" value="{{ salon.ubicacion|default:'' }}" style="width:100%;padding:10px 12px;border:1.5px solid #bfc8d6;border-radius:8px;font-size:1rem;background:#f7f9fc;color:#222;transition:border 0.2s;">
        </div>
        <div class="form-actions" style="display:flex;gap:16px;margin-top:10px;">
            <button type="submit" class="btn-guardar" style="background:#1976d2;color:#fff;border:none;border-radius:8px;padding:10px 28px;font-weight:600;font-size:1rem;cursor:pointer;transition:background 0.2s;display:flex;align-items:center;gap:8px;"><i class="fa-solid fa-check"></i> Guardar</button>
            <a href="{% url 'salones_admin' %}" class="btn-cancelar" style="background:#fff;color:#1976d2;border:1.5px solid #1976d2;border-radius:8px;padding:10px 22px;font-weight:600;font-size:1rem;text-decoration:none;transition:background 0.2s,color 0.2s;display:flex;align-items:center;gap:8px;"><i class="fa-solid fa-xmark"></i> Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
