{% extends 'adminlab/base.html' %}
{% load static %}
{% block content %}
<main class="profesor-main-content" style="width:100%;max-width:1200px;margin:0 auto;">
    <div style="padding: 24px; width:100%; max-width:1200px; margin:auto;">
        <div class="admin-header" style="display:flex;align-items:center;justify-content:space-between;margin-bottom:32px;">
            <h1 style="color:#283593;font-size:2.2rem;font-weight:800;margin:0;letter-spacing:1px;"><i class="fa-solid fa-school"></i> Gestión de Salones</h1>
            <div class="admin-user" style="font-size:1.1rem;color:#1976d2;background:#fff;border-radius:20px;padding:8px 18px;box-shadow:0 2px 8px rgba(25,118,210,0.07);"><i class="fa-solid fa-user-shield"></i> Panel de salones</div>
        </div>
        <div class="salones-section" style="margin-bottom:40px;">
            <a href="{% url 'agregar_salon_admin' %}" class="btn-agregar" style="display:inline-block;background:#1976d2;color:#fff;padding:10px 22px;border-radius:8px;font-weight:600;text-decoration:none;margin-bottom:18px;margin-top:8px;transition:background 0.2s;box-shadow:0 2px 8px rgba(25,118,210,0.08);"><i class="fa-solid fa-plus"></i>Agregar Salón</a>
            <table class="salones-table" style="width:100%;background:#fff;border-radius:12px;box-shadow:0 2px 8px rgba(25,118,210,0.07);border-collapse:separate;border-spacing:0;overflow:hidden;margin-bottom:32px;">
                <thead>
                    <tr>
                        <th style="background:#e3e6ea;color:#283593;font-size:1.05rem;">Nombre</th>
                        <th style="background:#e3e6ea;color:#283593;font-size:1.05rem;">Ubicación</th>
                        <th style="background:#e3e6ea;color:#283593;font-size:1.05rem;">Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    {% for s in salones %}
                    <tr>
                        <td>{{ s.nombre }}</td>
                        <td>{{ s.ubicacion }}</td>
                        <td class="salones-actions" style="white-space:nowrap;">
                            <a href="{% url 'editar_salon_admin' s.id %}" style="color:#1976d2;font-weight:500;margin-right:10px;text-decoration:none;transition:color 0.2s;"><i class="fa-solid fa-pen-to-square"></i> Editar</a>
                            <a href="{% url 'eliminar_salon_admin' s.id %}" onclick="return confirm('¿Eliminar este salón?');" style="color:#1976d2;font-weight:500;text-decoration:none;transition:color 0.2s;"><i class="fa-solid fa-trash"></i> Eliminar</a>
                        </td>
                    </tr>
                    {% empty %}
                    <tr><td colspan="3">No hay salones registrados.</td></tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</main>
{% endblock %}
