{% extends 'adminlab/base.html' %}
{% load static %}
{% block content %}
<div style="padding: 40px; max-width: 1200px; margin: auto;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px;">
        <h1 style="font-size: 2.5rem; font-weight: 800;">SALONES</h1>
        <a href="{% url 'agregar_salon_admin' %}" style="background: #e0f7fa; color: #00796b; padding: 10px 20px; border-radius: 8px; text-decoration: none; font-weight: bold;">Agregar Salón</a>
    </div>
    <div class="salon-grid">
        {% for salon in salones %}
            <div class="salon-door">
                <div class="window"></div>
                <div class="number-plate">{{ salon.nombre }}</div>
                <div class="knob"></div>
                <div class="salon-actions">
                    <a href="{% url 'editar_salon_admin' salon.id %}" class="edit-btn"><i class="fas fa-edit"></i></a>
                    <a href="{% url 'eliminar_salon_admin' salon.id %}" class="delete-btn"><i class="fas fa-trash"></i></a>
                </div>
            </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
