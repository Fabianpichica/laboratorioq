{% extends 'adminlab/base.html' %}
{% load static %}
{% block content %}
<main class="admin-main-content" style="width:100%;max-width:1200px;margin:0 auto;">
    <div class="card-admin" style="padding:32px 18px 24px 18px;width:100%;max-width:1200px;margin:auto;background:#fff;border-radius:18px;box-shadow:0 4px 18px rgba(40,53,147,0.09);">
        <div class="admin-header" style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px 0;margin-bottom:32px;">
            <h1 style="color:#283593;font-size:2.2rem;font-weight:800;margin:0;letter-spacing:1px;display:flex;align-items:center;gap:10px;"><i class="fa-solid fa-school"></i> Gestión de Salones</h1>
            <div class="admin-user" style="font-size:1.1rem;color:#1976d2;background:#f5f7fa;border-radius:20px;padding:8px 18px;box-shadow:0 2px 8px rgba(25,118,210,0.07);display:flex;align-items:center;gap:8px;"><i class="fa-solid fa-user-shield"></i> Panel de salones</div>
        </div>
        <div class="salones-section" style="margin-bottom:40px;">
            <a href="{% url 'agregar_salon_admin' %}" class="btn-agregar" style="display:inline-block;background:linear-gradient(90deg,#1976d2,#283593);color:#fff;padding:10px 22px;border-radius:8px;font-weight:600;text-decoration:none;margin-bottom:18px;margin-top:8px;transition:background 0.2s;box-shadow:0 2px 8px rgba(25,118,210,0.08);font-size:1.08rem;letter-spacing:0.5px;"><i class="fa-solid fa-plus"></i> Agregar Salón</a>
            <div style="overflow-x:auto;width:100%;">
                <table class="salones-table" style="min-width:480px;width:100%;background:#fff;border-radius:12px;box-shadow:0 2px 8px rgba(25,118,210,0.07);border-collapse:separate;border-spacing:0;overflow:hidden;margin-bottom:32px;">
                    <thead>
                        <tr>
                            <th style="background:#e3e6ea;color:#283593;font-size:1.05rem;font-weight:700;padding:14px 10px;text-align:left;">Nombre</th>
                            <th style="background:#e3e6ea;color:#283593;font-size:1.05rem;font-weight:700;padding:14px 10px;text-align:left;">Ubicación</th>
                            <th style="background:#e3e6ea;color:#283593;font-size:1.05rem;font-weight:700;padding:14px 10px;text-align:left;">Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for s in salones %}
                        <tr style="border-bottom:1px solid #f0f2f7;">
                            <td style="padding:12px 10px;vertical-align:middle;">{{ s.nombre }}</td>
                            <td style="padding:12px 10px;vertical-align:middle;">{{ s.ubicacion }}</td>
                            <td class="salones-actions" style="white-space:nowrap;padding:12px 10px;vertical-align:middle;">
                                <a href="{% url 'editar_salon_admin' s.id %}" class="btn-editar" style="color:#1976d2;font-weight:500;margin-right:10px;text-decoration:none;padding:6px 14px;border-radius:6px;background:#e3e6ea;transition:background 0.2s, color 0.2s;display:inline-flex;align-items:center;gap:6px;"><i class="fa-solid fa-pen-to-square"></i> Editar</a>
                                <a href="{% url 'eliminar_salon_admin' s.id %}" onclick="return confirm('¿Eliminar este salón?');" class="btn-eliminar" style="color:#fff;font-weight:500;text-decoration:none;padding:6px 14px;border-radius:6px;background:linear-gradient(90deg,#e53935,#d32f2f);transition:background 0.2s;color:#fff;display:inline-flex;align-items:center;gap:6px;"><i class="fa-solid fa-trash"></i> Eliminar</a>
                            </td>
                        </tr>
                        {% empty %}
                        <tr><td colspan="3" style="padding:18px 10px;text-align:center;color:#888;font-size:1.08rem;">No hay salones registrados.</td></tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>
<style>
@media (max-width: 900px) {
    .admin-header {flex-direction:column;align-items:flex-start;gap:10px;}
    .card-admin {padding:18px 6px;}
}
@media (max-width: 600px) {
    .card-admin {padding:10px 2px;}
    .salones-table th, .salones-table td {font-size:0.98rem;padding:10px 6px;}
    .btn-agregar {font-size:1rem;padding:8px 12px;}
    .btn-editar, .btn-eliminar {font-size:0.97rem;padding:5px 10px;}
}
</style>
{% endblock %}
