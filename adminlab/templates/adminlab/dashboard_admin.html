{% extends 'adminlab/base.html' %}
{% load static %}
{% block content %}
<div style="padding: 40px; max-width: 1200px; margin: auto;">
    <h1 style="font-size: 2.5rem; font-weight: 800; margin-bottom: 5px;">Bienvenido, Administrador</h1>
    <p style="font-size: 1.2rem; color: #555; margin-bottom: 40px;">{{ user.username }}</p>

    <div class="admin-grid">
        <a href="{% url 'inventario_admin' %}" class="admin-card-new">
            <div class="card-header inventario"><i class="fas fa-boxes-stacked"></i> INVENTARIO</div>
            <div class="card-body"></div>
        </a>
        <a href="{% url 'estudiantes_admin' %}" class="admin-card-new">
            <div class="card-header estudiantes"><i class="fas fa-user-graduate"></i> ESTUDIANTES</div>
            <div class="card-body"></div>
        </a>
        <a href="{% url 'profesores_admin' %}" class="admin-card-new">
            <div class="card-header profesores"><i class="fas fa-chalkboard-teacher"></i> PROFESORES</div>
            <div class="card-body"></div>
        </a>
        <a href="{% url 'salones_admin' %}" class="admin-card-new">
            <div class="card-header salones"><i class="fas fa-school"></i> SALONES</div>
            <div class="card-body"></div>
        </a>
        <a href="{% url 'guias_admin' %}" class="admin-card-new">
            <div class="card-header guias"><i class="fas fa-book"></i> GUIAS</div>
            <div class="card-body"></div>
        </a>
        <a href="{% url 'jornadas_admin' %}" class="admin-card-new">
            <div class="card-header jornadas"><i class="fas fa-calendar-days"></i> JORNADAS</div>
            <div class="card-body"></div>
        </a>
    </div>
</div>
{% endblock %}
