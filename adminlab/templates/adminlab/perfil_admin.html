{% extends 'adminlab/base.html' %}
{% load static %}

{% block content %}
<style>
    .main-content {
        background: url('{% static "img/perfil_background2.png" %}') center center no-repeat !important;
        background-size: cover !important;
        display: flex !important;
        justify-content: flex-end !important;
        align-items: center !important;
    }
    .profile-info {
        width: 650px;
        padding-right: 20%; /* Mueve el contenido a la izquierda */
    }
    .profile-info h1 {
        text-align: center;
        font-size: 2.4rem;
        font-weight: bold;
        margin-bottom: 30px;
        color: #333;
    }
    .info-item {
        display: flex;
        margin-bottom: 15px;
        font-size: 1.3rem;
        align-items: center;
    }
    .info-label {
        background-color: #c8e6c9;
        padding: 10px 15px;
        border-radius: 10px 0 0 10px;
        font-weight: bold;
        color: #2e7d32;
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        width: 120px;
        text-align: center;
    }
    .info-value {
        background-color: #fff;
        padding: 10px 15px;
        border-radius: 0 10px 10px 0;
        flex-grow: 1;
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
</style>

<div class="profile-info">
    <h1>Perfil del Administrador</h1>
    <div class="info-item">
        <div class="info-label">Usuario:</div>
        <div class="info-value">{{ user.username }}</div>
    </div>
    <div class="info-item">
        <div class="info-label">Email</div>
        <div class="info-value">{{ user.email }}</div>
    </div>
    <div class="info-item">
        <div class="info-label">Rol</div>
        <div class="info-value">Administrador</div>
    </div>
</div>
{% endblock %}
