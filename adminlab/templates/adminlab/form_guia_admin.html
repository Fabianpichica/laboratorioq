{% extends 'adminlab/base.html' %}
{% block title %}{{ guia|default:'Agregar Guía' }}{% endblock %}
{% block content %}
<div class="main-bg" style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#fff;">
  <div class="form-card" style="max-width:420px;width:100%;margin:0 auto;background:#fff;border-radius:22px;box-shadow:0 8px 32px rgba(25,118,210,0.13);padding:28px 16px 20px 16px;display:flex;flex-direction:column;align-items:center;animation:fadeInCard 0.7s;">
    <h2 style="color:#283593;font-size:1.25rem;margin-bottom:14px;font-weight:800;letter-spacing:0.5px;">{% if guia %}Editar Guía{% else %}Agregar Guía{% endif %}</h2>
    <form method="post" enctype="multipart/form-data" style="width:100%;display:flex;flex-direction:column;gap:14px;">
        {% csrf_token %}
        <div class="form-group">
            <label for="titulo">Título</label>
            <input type="text" name="titulo" id="titulo" value="{{ guia.titulo|default:'' }}" required class="input-modern input-blanco" placeholder="Título de la guía">
        </div>
        <div class="form-group">
            <label for="descripcion">Descripción</label>
            <textarea name="descripcion" id="descripcion" class="input-modern input-blanco" placeholder="Descripción" style="min-height:80px;resize:vertical;">{{ guia.descripcion|default:'' }}</textarea>
        </div>
        <div class="form-group">
            <label for="archivo">Archivo (PDF)</label>
            <input type="file" name="archivo" id="archivo" accept="application/pdf" class="input-modern input-blanco">
        </div>
        <div class="form-group">
            <label for="salones">Salones asignados</label>
            <select name="salones" id="salones" multiple class="input-modern input-blanco select2-multi" data-placeholder="Selecciona los salones">
                {% for s in salones %}
                <option value="{{ s.id }}" {% if guia and s in guia.salones.all %}selected{% endif %}>{{ s.nombre }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-actions" style="display:flex;gap:10px;margin-top:10px;justify-content:center;">
            <button type="submit" class="btn-guardar">Guardar</button>
            <a href="{% url 'guias_admin' %}" class="btn-cancelar">Cancelar</a>
        </div>
    </form>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/select2/4.0.13/js/select2.min.js"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/select2/4.0.13/css/select2.min.css" rel="stylesheet" />
<script>
document.addEventListener('DOMContentLoaded', function() {
  const select = document.getElementById('salones');
  if(select) {
    $(select).select2({
      width: '100%',
      placeholder: select.getAttribute('data-placeholder'),
      allowClear: true,
      closeOnSelect: false,
      dropdownCssClass: 'select2-modern',
      selectionCssClass: 'select2-modern',
      tags: false,
      language: {
        noResults: function() {
          return 'No hay salones disponibles';
        }
      }
    });
  }
});
</script>
<style>
@keyframes fadeInCard {
  from { opacity:0; transform:translateY(30px); }
  to { opacity:1; transform:translateY(0); }
}
.main-bg { min-height:100vh; }
.form-card { transition:box-shadow 0.2s; }
.form-group { display:flex;flex-direction:column;gap:6px;margin-bottom:8px; }
.form-group label {
  font-size:0.97rem;font-weight:500;color:#1976d2;margin-bottom:2px;letter-spacing:0.1px;
}
.input-modern.input-blanco {
  background:#fff !important;
  border:2px solid #e0e0e0 !important;
  border-radius:16px !important;
  box-shadow:0 2px 12px rgba(25,118,210,0.10) !important;
  color:#222 !important;
  font-size:1.12rem !important;
  padding:14px 16px !important;
  transition:box-shadow 0.2s, border 0.2s;
}
.input-modern.input-blanco::placeholder {
  color:#b0b0b0 !important;
  font-weight:400;
  font-size:1.05rem;
}
.input-modern.input-blanco:focus {
  border:2px solid #e0e0e0 !important;
  box-shadow:0 0 0 3px #90caf9 !important;
  outline:none;
}
textarea.input-modern.input-blanco {
  min-height:80px !important;
  resize:vertical !important;
}
.btn-guardar {
  background:linear-gradient(90deg,#1976d2 60%,#00bcd4 100%);color:#fff;border:none;border-radius:13px;padding:13px 0;font-weight:700;font-size:1.08rem;cursor:pointer;transition:background 0.2s,box-shadow 0.2s;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 2px 10px rgba(25,118,210,0.10);width:50%;
}
.btn-guardar:hover {
  background:linear-gradient(90deg,#1565c0 60%,#0097a7 100%);box-shadow:0 4px 16px rgba(25,118,210,0.16);
}
.btn-cancelar {
  background:#fff;color:#1976d2;border:1.5px solid #1976d2;border-radius:13px;padding:13px 0;font-weight:700;font-size:1.08rem;text-decoration:none;transition:background 0.2s,color 0.2s,box-shadow 0.2s;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 2px 10px rgba(25,118,210,0.07);width:50%;
}
.btn-cancelar:hover {
  background:#e3f2fd;color:#1565c0;box-shadow:0 4px 14px rgba(25,118,210,0.10);
}
.form-actions { flex-direction:row;gap:10px; }
.select2-container.select2-modern .select2-selection--multiple {
  background: #fff;
  border-radius: 16px;
  border: 2px solid #e0e0e0;
  min-height: 48px;
  box-shadow: 0 2px 12px rgba(25,118,210,0.10);
  font-size: 1.08rem;
  padding: 6px 8px;
  transition: box-shadow 0.2s, border 0.2s;
}
.select2-container.select2-modern .select2-selection--multiple:focus {
  border:2px solid #90caf9;
  box-shadow:0 0 0 3px #90caf9;
}
.select2-container.select2-modern .select2-selection--multiple .select2-selection__choice {
  background: #e3e6ea;
  color: #283593;
  border-radius: 12px;
  font-size: 0.98rem;
  font-weight: 600;
  margin: 2px 6px 2px 0;
  padding: 4px 12px;
  box-shadow: 0 1px 4px rgba(40,53,147,0.07);
  display: flex;
  align-items: center;
}
.select2-container.select2-modern .select2-selection--multiple .select2-selection__choice__remove {
  color: #d32f2f;
  margin-right: 6px;
  font-size: 1.1em;
  cursor: pointer;
}
.select2-container.select2-modern .select2-dropdown {
  border-radius: 14px;
  box-shadow: 0 4px 18px rgba(40,53,147,0.09);
  border: 2px solid #e0e0e0;
}
.select2-container.select2-modern .select2-results__option {
  padding: 10px 14px;
  font-size: 1.05rem;
  color: #283593;
  border-radius: 8px;
  transition: background 0.2s;
}
.select2-container.select2-modern .select2-results__option--highlighted {
  background: #e3f2fd;
  color: #1976d2;
}
@media (max-width: 600px) {
  .main-bg { padding:0; }
  .form-card { max-width:99vw !important; padding:10px 2vw 10px 2vw !important; border-radius:14px !important; }
  .form-card h2 { font-size:1rem !important; }
  .form-group label { font-size:0.95rem !important; }
  .input-modern.input-blanco { font-size:1rem !important; padding:11px 8px !important; border-radius:12px !important; }
  textarea.input-modern.input-blanco { min-height:60px !important; }
  .form-actions { flex-direction:column !important; gap:7px !important; }
  .btn-guardar, .btn-cancelar { width:100% !important; font-size:0.97rem !important; padding:10px 0 !important; }
  .select2-container.select2-modern .select2-selection--multiple {
    font-size: 0.97rem;
    min-height: 38px;
    padding: 4px 4px;
    border-radius: 12px;
  }
  .select2-container.select2-modern .select2-selection--multiple .select2-selection__choice {
    font-size: 0.95rem;
    padding: 3px 8px;
    border-radius: 10px;
  }
  .select2-container.select2-modern .select2-results__option {
    font-size: 0.97rem;
    padding: 8px 10px;
  }
}
</style>
{% endblock %}
