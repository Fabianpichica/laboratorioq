{% extends 'adminlab/base.html' %}
{% load static %}
{% block content %}
<div class="main-bg" style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#fff;">
  <div class="form-card" style="max-width:420px;width:100%;margin:0 auto;background:#fff;border-radius:22px;box-shadow:0 8px 32px rgba(25,118,210,0.13);padding:28px 16px 20px 16px;display:flex;flex-direction:column;align-items:center;animation:fadeInCard 0.7s;">
    <h2 style="color:#283593;font-size:1.25rem;margin-bottom:14px;font-weight:800;letter-spacing:0.5px;display:flex;align-items:center;gap:10px;"><i class="fa-solid fa-user-graduate"></i> {% if estudiante %}Editar Estudiante{% else %}Agregar Estudiante{% endif %}</h2>
    <form method="post" enctype="multipart/form-data" style="width:100%;display:flex;flex-direction:column;gap:14px;">
        {% csrf_token %}
        <div class="form-group">
            <label for="nombre">Nombre</label>
            <input type="text" name="nombre" id="nombre" placeholder="Nombre completo" value="{{ estudiante.nombre|default:'' }}" required class="input-modern input-blanco">
        </div>
        <div class="form-group">
            <label for="documento">Documento</label>
            <input type="text" name="documento" id="documento" placeholder="Documento" value="{{ estudiante.documento|default:'' }}" required class="input-modern input-blanco">
        </div>
        <div class="form-group">
            <label for="tipo_documento">Tipo de documento</label>
            <select name="tipo_documento" id="tipo_documento" required class="input-modern input-blanco">
                <option value="">-- Selecciona --</option>
                <option value="CC" {% if estudiante and estudiante.tipo_documento == 'CC' %}selected{% endif %}>Cédula de ciudadanía</option>
                <option value="TI" {% if estudiante and estudiante.tipo_documento == 'TI' %}selected{% endif %}>Tarjeta de identidad</option>
                <option value="CE" {% if estudiante and estudiante.tipo_documento == 'CE' %}selected{% endif %}>Cédula de extranjería</option>
            </select>
        </div>
        <div class="form-group">
            <label for="salon">Salón</label>
            <select name="salon" id="salon" class="input-modern input-blanco">
                <option value="">-- --</option>
                {% for s in salones %}
                    <option value="{{ s.id }}" {% if estudiante and estudiante.salon and estudiante.salon.id == s.id %}selected{% endif %}>{{ s.nombre }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label for="jornada">Jornada</label>
            <select name="jornada" id="jornada" class="input-modern input-blanco">
                <option value="">-- --</option>
                {% for j in jornadas %}
                    <option value="{{ j.id }}" {% if estudiante and estudiante.jornada and estudiante.jornada.id == j.id %}selected{% endif %}>{{ j.nombre }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label for="correo">Correo</label>
            <input type="email" name="correo" id="correo" placeholder="Correo electrónico" value="{{ estudiante.correo|default:'' }}" class="input-modern input-blanco">
        </div>
        <div class="form-group">
            <label for="telefono">Teléfono</label>
            <input type="text" name="telefono" id="telefono" placeholder="Teléfono" value="{{ estudiante.telefono|default:'' }}" class="input-modern input-blanco">
        </div>
        <div class="form-group">
            <label for="password">Contraseña</label>
            <input type="password" name="password" id="password" placeholder="Contraseña" value="{{ estudiante.password|default:'' }}" class="input-modern input-blanco">
        </div>
        <div class="form-group">
            <label for="foto">Fotografía</label>
            <input type="file" name="foto" id="foto" accept="image/*" class="input-modern input-blanco">
        </div>
        <div class="form-actions" style="display:flex;gap:10px;margin-top:10px;justify-content:center;">
            <button type="submit" class="btn-guardar"><i class="fa-solid fa-check"></i> Guardar</button>
            <a href="{% url 'estudiantes_admin' %}" class="btn-cancelar"><i class="fa-solid fa-xmark"></i> Cancelar</a>
        </div>
    </form>
  </div>
</div>
<style>
@keyframes fadeInCard {
  from { opacity:0; transform:translateY(30px); }
  to { opacity:1; transform:translateY(0); }
}
.main-bg { min-height:100vh; }
.form-card { transition:box-shadow 0.2s; }
.form-group { display:flex;flex-direction:column;gap:6px;margin-bottom:8px; }
.form-group label {
  font-size:0.97rem;font-weight:500;color:#1976d2;margin-bottom:2px;letter-spacing:0.1px;
}
.input-modern.input-blanco {
  background:#fff !important;
  border:2px solid #e0e0e0 !important;
  border-radius:16px !important;
  box-shadow:0 2px 12px rgba(25,118,210,0.10) !important;
  color:#222 !important;
  font-size:1.12rem !important;
  padding:14px 16px !important;
  transition:box-shadow 0.2s, border 0.2s;
}
.input-modern.input-blanco::placeholder {
  color:#b0b0b0 !important;
  font-weight:400;
  font-size:1.05rem;
}
.input-modern.input-blanco:focus {
  border:2px solid #e0e0e0 !important;
  box-shadow:0 0 0 3px #90caf9 !important;
  outline:none;
}
.btn-guardar {
  background:linear-gradient(90deg,#1976d2 60%,#00bcd4 100%);color:#fff;border:none;border-radius:13px;padding:13px 0;font-weight:700;font-size:1.08rem;cursor:pointer;transition:background 0.2s,box-shadow 0.2s;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 2px 10px rgba(25,118,210,0.10);width:50%;
}
.btn-guardar:hover {
  background:linear-gradient(90deg,#1565c0 60%,#0097a7 100%);box-shadow:0 4px 16px rgba(25,118,210,0.16);
}
.btn-cancelar {
  background:#fff;color:#1976d2;border:1.5px solid #1976d2;border-radius:13px;padding:13px 0;font-weight:700;font-size:1.08rem;text-decoration:none;transition:background 0.2s,color 0.2s,box-shadow 0.2s;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 2px 10px rgba(25,118,210,0.07);width:50%;
}
.btn-cancelar:hover {
  background:#e3f2fd;color:#1565c0;box-shadow:0 4px 14px rgba(25,118,210,0.10);
}
.form-actions { flex-direction:row;gap:10px; }
@media (max-width: 600px) {
  .main-bg { padding:0; }
  .form-card { max-width:99vw !important; padding:10px 2vw 10px 2vw !important; border-radius:14px !important; }
  .form-card h2 { font-size:1rem !important; }
  .form-group label { font-size:0.95rem !important; }
  .input-modern.input-blanco { font-size:1rem !important; padding:11px 8px !important; border-radius:12px !important; }
  .form-actions { flex-direction:column !important; gap:7px !important; }
  .btn-guardar, .btn-cancelar { width:100% !important; font-size:0.97rem !important; padding:10px 0 !important; }
}
</style>
{% endblock %}
