{% extends 'adminlab/base.html' %}
{% load static %}
{% block content %}
<div class="form-card" style="max-width:480px;margin:60px auto;background:#fff;border-radius:16px;box-shadow:0 2px 16px rgba(25,118,210,0.10);padding:36px 32px 28px 32px;display:flex;flex-direction:column;align-items:center;">
    <h2 style="color:#283593;font-size:1.5rem;margin-bottom:18px;display:flex;align-items:center;gap:10px;"><i class="fa-solid fa-user-graduate"></i> {% if estudiante %}Editar Estudiante{% else %}Agregar Estudiante{% endif %}</h2>
    <form method="post" enctype="multipart/form-data" style="width:100%;display:flex;flex-direction:column;gap:18px;">
        {% csrf_token %}
        <div>
            <label for="nombre" style="color:#1976d2;font-weight:600;margin-bottom:4px;">Nombre</label>
            <input type="text" name="nombre" id="nombre" placeholder="Nombre completo" value="{{ estudiante.nombre|default:'' }}" required style="width:100%;padding:10px 12px;border:1.5px solid #bfc8d6;border-radius:8px;font-size:1rem;background:#f7f9fc;color:#222;transition:border 0.2s;">
        </div>
        <div>
            <label for="documento" style="color:#1976d2;font-weight:600;margin-bottom:4px;">Documento</label>
            <input type="text" name="documento" id="documento" placeholder="Documento" value="{{ estudiante.documento|default:'' }}" required style="width:100%;padding:10px 12px;border:1.5px solid #bfc8d6;border-radius:8px;font-size:1rem;background:#f7f9fc;color:#222;transition:border 0.2s;">
        </div>
        <div>
            <label for="tipo_documento" style="color:#1976d2;font-weight:600;margin-bottom:4px;">Tipo de documento</label>
            <select name="tipo_documento" id="tipo_documento" required style="width:100%;padding:10px 12px;border-radius:8px;">
                <option value="">-- Selecciona --</option>
                <option value="CC" {% if estudiante and estudiante.tipo_documento == 'CC' %}selected{% endif %}>Cédula de ciudadanía</option>
                <option value="TI" {% if estudiante and estudiante.tipo_documento == 'TI' %}selected{% endif %}>Tarjeta de identidad</option>
                <option value="CE" {% if estudiante and estudiante.tipo_documento == 'CE' %}selected{% endif %}>Cédula de extranjería</option>
            </select>
        </div>
        <div>
            <label for="salon" style="color:#1976d2;font-weight:600;margin-bottom:4px;">Salón</label>
            <select name="salon" id="salon" style="width:100%;padding:10px 12px;border-radius:8px;">
                <option value="">-- --</option>
                {% for s in salones %}
                    <option value="{{ s.id }}" {% if estudiante and estudiante.salon and estudiante.salon.id == s.id %}selected{% endif %}>{{ s.nombre }}</option>
                {% endfor %}
            </select>
        </div>
        <div>
            <label for="jornada" style="color:#1976d2;font-weight:600;margin-bottom:4px;">Jornada</label>
            <select name="jornada" id="jornada" style="width:100%;padding:10px 12px;border-radius:8px;">
                <option value="">-- --</option>
                {% for j in jornadas %}
                    <option value="{{ j.id }}" {% if estudiante and estudiante.jornada and estudiante.jornada.id == j.id %}selected{% endif %}>{{ j.nombre }}</option>
                {% endfor %}
            </select>
        </div>
        <div>
            <label for="correo" style="color:#1976d2;font-weight:600;margin-bottom:4px;">Correo</label>
            <input type="email" name="correo" id="correo" placeholder="Correo electrónico" value="{{ estudiante.correo|default:'' }}" style="width:100%;padding:10px 12px;border:1.5px solid #bfc8d6;border-radius:8px;font-size:1rem;background:#f7f9fc;color:#222;transition:border 0.2s;">
        </div>
        <div>
            <label for="telefono" style="color:#1976d2;font-weight:600;margin-bottom:4px;">Teléfono</label>
            <input type="text" name="telefono" id="telefono" placeholder="Teléfono" value="{{ estudiante.telefono|default:'' }}" style="width:100%;padding:10px 12px;border:1.5px solid #bfc8d6;border-radius:8px;font-size:1rem;background:#f7f9fc;color:#222;transition:border 0.2s;">
        </div>
        <div>
            <label for="password" style="color:#1976d2;font-weight:600;margin-bottom:4px;">Contraseña</label>
            <input type="password" name="password" id="password" placeholder="Contraseña" value="{{ estudiante.password|default:'' }}" style="width:100%;padding:10px 12px;border:1.5px solid #bfc8d6;border-radius:8px;font-size:1rem;background:#f7f9fc;color:#222;transition:border 0.2s;">
        </div>
        <div>
            <label for="foto" style="color:#1976d2;font-weight:600;margin-bottom:4px;">Fotografía</label>
            <input type="file" name="foto" id="foto" accept="image/*" style="width:100%;padding:10px 12px;border:1.5px solid #bfc8d6;border-radius:8px;font-size:1rem;background:#f7f9fc;color:#222;transition:border 0.2s;">
        </div>
        <div class="form-actions" style="display:flex;gap:16px;margin-top:10px;">
            <button type="submit" class="btn-guardar" style="background:#1976d2;color:#fff;border:none;border-radius:8px;padding:10px 28px;font-weight:600;font-size:1rem;cursor:pointer;transition:background 0.2s;display:flex;align-items:center;gap:8px;"><i class="fa-solid fa-check"></i> Guardar</button>
            <a href="{% url 'estudiantes_admin' %}" class="btn-cancelar" style="background:#fff;color:#1976d2;border:1.5px solid #1976d2;border-radius:8px;padding:10px 22px;font-weight:600;font-size:1rem;text-decoration:none;transition:background 0.2s,color 0.2s;display:flex;align-items:center;gap:8px;"><i class="fa-solid fa-xmark"></i> Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
