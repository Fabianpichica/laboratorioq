{% extends 'adminlab/base.html' %}
{% load static %}
{% block content %}
<div class="form-card" style="max-width:480px;margin:60px auto;background:#fff;border-radius:16px;box-shadow:0 2px 16px rgba(25,118,210,0.10);padding:36px 32px 28px 32px;display:flex;flex-direction:column;align-items:center;">
    <h2 style="color:#283593;font-size:1.5rem;margin-bottom:18px;display:flex;align-items:center;gap:10px;"><i class="fa-solid fa-user-tie"></i> Editar Profesor</h2>
    <form method="post" enctype="multipart/form-data" style="width:100%;display:flex;flex-direction:column;gap:18px;">
        {% csrf_token %}
        <div>
            <label for="nombre" style="color:#1976d2;font-weight:600;margin-bottom:4px;">Nombre completo</label>
            <input type="text" name="nombre" id="nombre" value="{{ profesor.first_name }}" required style="width:100%;padding:10px 12px;border:1.5px solid #bfc8d6;border-radius:8px;font-size:1rem;background:#f7f9fc;color:#222;transition:border 0.2s;">
        </div>
        <div>
            <label for="password" style="color:#1976d2;font-weight:600;margin-bottom:4px;">Contraseña (dejar en blanco para no cambiar)</label>
            <input type="password" name="password" id="password" placeholder="Nueva contraseña" style="width:100%;padding:10px 12px;border:1.5px solid #bfc8d6;border-radius:8px;font-size:1rem;background:#f7f9fc;color:#222;transition:border 0.2s;">
        </div>
        <div>
            <label for="fotografia" style="color:#1976d2;font-weight:600;margin-bottom:4px;">Fotografía</label>
            {% if profile.fotografia %}
                <img src="{{ profile.fotografia.url }}" alt="Foto actual" style="width:48px;height:48px;border-radius:50%;object-fit:cover;margin-bottom:8px;">
            {% endif %}
            <input type="file" name="fotografia" id="fotografia" accept="image/*" style="width:100%;padding:10px 12px;border:1.5px solid #bfc8d6;border-radius:8px;font-size:1rem;background:#f7f9fc;color:#222;transition:border 0.2s;">
        </div>
        <div>
            <label for="jornadas" style="color:#1976d2;font-weight:600;margin-bottom:4px;">Jornadas asignadas</label>
            <select name="jornadas" id="jornadas" multiple style="width:100%;padding:10px 12px;border-radius:8px;">
                {% for jornada in jornadas %}
                    <option value="{{ jornada.id }}" {% if jornada in jornadas_actuales %}selected{% endif %}>{{ jornada.nombre }} ({{ jornada.fecha }})</option>
                {% endfor %}
            </select>
        </div>
        <div>
            <label for="salones" style="color:#1976d2;font-weight:600;margin-bottom:4px;">Salones asignados</label>
            <select name="salones" id="salones" multiple style="width:100%;padding:10px 12px;border-radius:8px;">
                {% for salon in salones %}
                    <option value="{{ salon.id }}" {% if salon in salones_actuales %}selected{% endif %}>{{ salon.nombre }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-actions" style="display:flex;gap:16px;margin-top:10px;">
            <button type="submit" class="btn-guardar" style="background:#1976d2;color:#fff;border:none;border-radius:8px;padding:10px 28px;font-weight:600;font-size:1rem;cursor:pointer;transition:background 0.2s;display:flex;align-items:center;gap:8px;"><i class="fa-solid fa-check"></i> Guardar</button>
            <a href="{% url 'profesores_admin' %}" class="btn-cancelar" style="background:#fff;color:#1976d2;border:1.5px solid #1976d2;border-radius:8px;padding:10px 22px;font-weight:600;font-size:1rem;text-decoration:none;transition:background 0.2s,color 0.2s;display:flex;align-items:center;gap:8px;"><i class="fa-solid fa-xmark"></i> Cancelar</a>
        </div>
    </form>
</div>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
<script>
$(document).ready(function() {
    $('select[multiple]').select2({
        width: '100%',
        placeholder: 'Selecciona una o varias opciones',
        allowClear: true
    });
});
</script>
{% endblock %}
