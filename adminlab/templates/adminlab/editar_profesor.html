{% extends 'adminlab/base.html' %}
{% load static %}
{% block content %}
<div class="main-bg" style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#fff;">
  <div class="form-card" style="max-width:420px;width:100%;margin:0 auto;background:#fff;border-radius:22px;box-shadow:0 8px 32px rgba(25,118,210,0.13);padding:28px 16px 20px 16px;display:flex;flex-direction:column;align-items:center;animation:fadeInCard 0.7s;">
    <h2 style="color:#283593;font-size:1.25rem;margin-bottom:14px;display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:0.5px;"><i class="fa-solid fa-user-tie" style="font-size:1.2em;"></i> Editar Profesor</h2>
    <form method="post" enctype="multipart/form-data" style="width:100%;display:flex;flex-direction:column;gap:14px;">
        {% csrf_token %}
        <div class="form-group">
            <label for="nombre">Nombre completo</label>
            <input type="text" name="nombre" id="nombre" value="{{ profesor.first_name }}" required class="input-modern input-blanco" placeholder="Nombre completo">
        </div>
        <div class="form-group">
            <label for="password">Contraseña (dejar en blanco para no cambiar)</label>
            <input type="password" name="password" id="password" placeholder="Nueva contraseña" class="input-modern input-blanco">
        </div>
        <div class="form-group center">
            <label for="fotografia">Fotografía</label>
            {% if profile.fotografia %}
                <img src="{{ profile.fotografia.url }}" alt="Foto actual" class="profile-img">
            {% endif %}
            <input type="file" name="fotografia" id="fotografia" accept="image/*" class="input-modern">
        </div>
        <div class="form-group">
            <label for="jornadas">Jornadas asignadas</label>
            <select name="jornadas" id="jornadas" multiple class="input-modern select2-multi">
                {% for jornada in jornadas %}
                    <option value="{{ jornada.id }}" {% if jornada in jornadas_actuales %}selected{% endif %}>{{ jornada.nombre }} ({{ jornada.fecha }})</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label for="salones">Salones asignados</label>
            <select name="salones" id="salones" multiple class="input-modern select2-multi">
                {% for salon in salones %}
                    <option value="{{ salon.id }}" {% if salon in salones_actuales %}selected{% endif %}>{{ salon.nombre }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-actions" style="display:flex;gap:10px;margin-top:10px;justify-content:center;">
            <button type="submit" class="btn-guardar"><i class="fa-solid fa-check"></i> Guardar</button>
            <a href="{% url 'profesores_admin' %}" class="btn-cancelar"><i class="fa-solid fa-xmark"></i> Cancelar</a>
        </div>
    </form>
  </div>
</div>
<style>
@keyframes fadeInCard {
  from { opacity:0; transform:translateY(30px); }
  to { opacity:1; transform:translateY(0); }
}
.main-bg { min-height:100vh; }
.form-card { transition:box-shadow 0.2s; }
.form-group { display:flex;flex-direction:column;gap:4px;margin-bottom:2px; }
.form-group label {
  font-size:0.98rem;font-weight:500;color:#1976d2;margin-bottom:2px;letter-spacing:0.1px;
}
.input-modern {
  width:100%;padding:11px 13px;border:1.5px solid #e3eafc;border-radius:13px;font-size:1rem;background:#fff;color:#222;transition:border 0.2s,box-shadow 0.2s;
  box-shadow:0 1px 6px rgba(25,118,210,0.04);
  outline:none;
}
.input-modern:focus {
  border-color:#1976d2;box-shadow:0 0 0 2px #90caf9;
}
.input-blanco {
  background: #fff !important;
  border: 2px solid #e0e0e0 !important;
  border-radius: 16px !important;
  box-shadow: 0 2px 12px rgba(25,118,210,0.10) !important;
  color: #222 !important;
  font-size: 1.12rem !important;
  padding: 14px 16px !important;
  transition: box-shadow 0.2s, border 0.2s;
}
.input-blanco::placeholder {
  color: #b0b0b0 !important;
  font-weight: 400;
  font-size: 1.05rem;
}
.input-blanco:focus {
  border: 2px solid #e0e0e0 !important;
  box-shadow: 0 0 0 3px #90caf9 !important;
  outline: none;
}
.select2-container--default .select2-selection--multiple {
  background:#fff;border:1.5px solid #e3eafc;border-radius:13px;min-height:44px;box-shadow:0 1px 6px rgba(25,118,210,0.04);padding:6px 8px;display:flex;flex-wrap:wrap;align-items:center;
}
.select2-container--default .select2-selection--multiple .select2-selection__choice {
  background:linear-gradient(90deg,#1976d2 60%,#00bcd4 100%);color:#fff;border:none;border-radius:8px;padding:5px 12px;font-size:0.97rem;margin:2px 4px;box-shadow:0 2px 8px rgba(25,118,210,0.10);font-weight:600;
}
.select2-container--default .select2-selection--multiple .select2-selection__choice__remove {
  color:#fff;margin-right:6px;font-size:1.1em;
}
.profile-img {
  width:60px;height:60px;border-radius:50%;object-fit:cover;margin-bottom:8px;border:2.5px solid #90caf9;box-shadow:0 2px 12px rgba(25,118,210,0.13);transition:border 0.2s,box-shadow 0.2s;display:block;margin-left:auto;margin-right:auto;
}
.profile-img:hover {
  border-color:#1976d2;box-shadow:0 4px 18px rgba(25,118,210,0.18);
}
.btn-guardar {
  background:linear-gradient(90deg,#1976d2 60%,#00bcd4 100%);color:#fff;border:none;border-radius:13px;padding:13px 0;font-weight:700;font-size:1.08rem;cursor:pointer;transition:background 0.2s,box-shadow 0.2s;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 2px 10px rgba(25,118,210,0.10);width:50%;
}
.btn-guardar:hover {
  background:linear-gradient(90deg,#1565c0 60%,#0097a7 100%);box-shadow:0 4px 16px rgba(25,118,210,0.16);
}
.btn-cancelar {
  background:#fff;color:#1976d2;border:1.5px solid #1976d2;border-radius:13px;padding:13px 0;font-weight:700;font-size:1.08rem;text-decoration:none;transition:background 0.2s,color 0.2s,box-shadow 0.2s;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 2px 10px rgba(25,118,210,0.07);width:50%;
}
.btn-cancelar:hover {
  background:#e3f2fd;color:#1565c0;box-shadow:0 4px 14px rgba(25,118,210,0.10);
}
.form-actions { flex-direction:row;gap:10px; }
.center { align-items:center; }
@media (max-width: 600px) {
  .main-bg { padding:0; }
  .form-card { max-width:99vw !important; padding:10px 2vw 10px 2vw !important; border-radius:14px !important; }
  .form-card h2 { font-size:1rem !important; }
  .form-group label { font-size:0.95rem !important; }
  .input-modern { font-size:0.97rem !important; padding:8px 7px !important; border-radius:8px !important; }
  .input-blanco { font-size:1rem !important; padding:11px 8px !important; border-radius:12px !important; }
  .form-actions { flex-direction:column !important; gap:7px !important; }
  .btn-guardar, .btn-cancelar { width:100% !important; font-size:0.97rem !important; padding:10px 0 !important; }
  .profile-img { width:48px !important; height:48px !important; }
  .select2-container--default .select2-selection--multiple { min-height:38px !important; padding:4px 4px !important; }
}
</style>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
<script>
$(document).ready(function() {
    $('.select2-multi').select2({
        width: '100%',
        placeholder: 'Selecciona una o varias opciones',
        allowClear: true
    });
});
</script>
{% endblock %}
