<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Editar Profesor</title>
    <link rel="stylesheet" href="/static/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <style>
        body { background: #f4f6fb; margin: 0; font-family: 'Segoe UI', Arial, sans-serif; }
        .form-card { max-width: 480px; margin: 60px auto; background: #fff; border-radius: 16px; box-shadow: 0 2px 16px rgba(25,118,210,0.10); padding: 36px 32px 28px 32px; display: flex; flex-direction: column; align-items: center; }
        .form-card h2 { color: #283593; font-size: 1.5rem; margin-bottom: 18px; display: flex; align-items: center; gap: 10px; }
        .form-card form { width: 100%; display: flex; flex-direction: column; gap: 18px; }
        .form-card label { color: #1976d2; font-weight: 600; margin-bottom: 4px; }
        .form-card input[type="text"],
        .form-card input[type="password"],
        .form-card input[type="file"] {
            width: 100%;
            padding: 10px 12px;
            border: 1.5px solid #bfc8d6;
            border-radius: 8px;
            font-size: 1rem;
            background: #f7f9fc;
            color: #222;
            transition: border 0.2s;
        }
        .form-card input:focus {
            border: 1.5px solid #1976d2;
            outline: none;
        }
        .form-actions { display: flex; gap: 16px; margin-top: 10px; }
        .btn-guardar { background: #1976d2; color: #fff; border: none; border-radius: 8px; padding: 10px 28px; font-weight: 600; font-size: 1rem; cursor: pointer; transition: background 0.2s; display: flex; align-items: center; gap: 8px; }
        .btn-guardar:hover { background: #1565c0; }
        .btn-cancelar { background: #fff; color: #1976d2; border: 1.5px solid #1976d2; border-radius: 8px; padding: 10px 22px; font-weight: 600; font-size: 1rem; text-decoration: none; transition: background 0.2s, color 0.2s; display: flex; align-items: center; gap: 8px; }
        .btn-cancelar:hover { background: #e3e6ea; color: #1565c0; }
    </style>
</head>
<body>
    <div class="form-card">
        <h2><i class="fa-solid fa-user-tie"></i> Editar Profesor</h2>
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <div>
                <label for="nombre">Nombre completo</label>
                <input type="text" name="nombre" id="nombre" value="{{ profesor.first_name }}" required>
            </div>
            <div>
                <label for="password">Contraseña (dejar en blanco para no cambiar)</label>
                <input type="password" name="password" id="password" placeholder="Nueva contraseña">
            </div>
            <div>
                <label for="fotografia">Fotografía</label>
                {% if profile.fotografia %}
                    <img src="{{ profile.fotografia.url }}" alt="Foto actual" style="width:48px;height:48px;border-radius:50%;object-fit:cover;margin-bottom:8px;">
                {% endif %}
                <input type="file" name="fotografia" id="fotografia" accept="image/*">
            </div>
            <div>
                <label for="jornadas">Jornadas asignadas</label>
                <select name="jornadas" id="jornadas" multiple style="width:100%;padding:10px 12px;border-radius:8px;">
                    {% for jornada in jornadas %}
                        <option value="{{ jornada.id }}" {% if jornada in jornadas_actuales %}selected{% endif %}>{{ jornada.nombre }} ({{ jornada.fecha }})</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label for="salones">Salones asignados</label>
                <select name="salones" id="salones" multiple style="width:100%;padding:10px 12px;border-radius:8px;">
                    {% for salon in salones %}
                        <option value="{{ salon.id }}" {% if salon in salones_actuales %}selected{% endif %}>{{ salon.nombre }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn-guardar"><i class="fa-solid fa-check"></i> Guardar</button>
                <a href="{% url 'profesores_admin' %}" class="btn-cancelar"><i class="fa-solid fa-xmark"></i> Cancelar</a>
            </div>
        </form>
    </div>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
    <script>
    $(document).ready(function() {
        $('select[multiple]').select2({
            width: '100%',
            placeholder: 'Selecciona una o varias opciones',
            allowClear: true
        });
    });
    </script>
</body>
</html>
