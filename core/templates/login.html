{% extends "base.html" %}
{% block title %}Login - Laboratorio{% endblock %}
{% block content %}
<div style="display: flex; justify-content: center; align-items: center; min-height: 80vh; background: #f5f5f5;">
    <form method="post" style="background: #fff; padding: 2rem 2.5rem; border-radius: 12px; box-shadow: 0 2px 16px rgba(0,0,0,0.08); min-width: 320px; max-width: 350px; width: 100%;">
        {% csrf_token %}
        <h2 style="text-align:center; color:#1976d2; margin-bottom: 1.5rem;">Iniciar Sesión</h2>
        {% if messages %}
            <div style="margin-bottom:1rem; color: #d32f2f; text-align:center;">
                {% for message in messages %}{{ message }}<br>{% endfor %}
            </div>
        {% endif %}
        <div style="margin-bottom: 1rem;">
            <label for="username" style="display:block; color:#333;">Usuario</label>
            <input type="text" name="username" id="username" class="form-control" style="width:100%; padding:0.5rem; border-radius:6px; border:1px solid #ccc;" required>
        </div>
        <div style="margin-bottom: 1.5rem;">
            <label for="password" style="display:block; color:#333;">Contraseña</label>
            <input type="password" name="password" id="password" class="form-control" style="width:100%; padding:0.5rem; border-radius:6px; border:1px solid #ccc;" required>
        </div>
        <button type="submit" style="width:100%; background:#1976d2; color:#fff; border:none; border-radius:6px; padding:0.7rem; font-size:1rem; cursor:pointer;">Entrar</button>
        <div style="text-align:center; margin-top:1rem;">
            <a href="{% url 'register' %}" style="color:#1976d2; text-decoration:none;">¿No tienes cuenta? Regístrate</a>
        </div>
    </form>
</div>
{% endblock %}
