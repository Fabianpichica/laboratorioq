<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Laboratorio</title>
    <style>
        body {
            background: url('/static/img/login.png') center center no-repeat;
            background-size: cover;
            min-height: 100vh;
            margin: 0;
            padding: 0;
        }
        .login-container {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            width: 100vw;
            padding-left: 8vw;
        }
        .login-form {
            background: #f4f8fc;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(25,118,210,0.13);
            padding: 80px 70px 56px 70px;
            min-width: 720px;
            max-width: 820px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 34px;
        }
        .login-form h2 {
            font-size: 3.8rem;
            font-weight: 900;
            text-align: center;
            margin-bottom: 44px;
            color: #181828;
            letter-spacing: -1px;
        }
        .login-form label {
            font-size: 1.5rem;
            font-weight: 600;
            color: #222;
            margin-bottom: 6px;
            margin-left: 2px;
        }
        .login-form input {
            width: 100%;
            padding: 28px 18px;
            border-radius: 10px;
            border: 1.5px solid #dbe6f3;
            font-size: 1.5rem;
            margin-bottom: 12px;
            background: #fff;
            box-shadow: 0 2px 8px rgba(25,118,210,0.07);
            outline: none;
            transition: border 0.2s;
        }
        .login-form input:focus {
            border-color: #90caf9;
        }
        .login-form button {
            background: #c8ecf2;
            color: #181828;
            font-weight: 900;
            font-size: 1.7rem;
            border-radius: 10px;
            padding: 28px 0;
            border: none;
            box-shadow: 0 2px 8px rgba(25,118,210,0.07);
            margin-top: 8px;
            margin-bottom: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .login-form button:hover {
            background: #b2e0ea;
        }
        .login-link {
            text-align: center;
            margin-top: 8px;
            font-size: 1.35rem;
        }
        .login-link a {
            color: #181828;
            text-decoration: underline;
            font-weight: 600;
        }
        .login-messages {
            color: #d32f2f;
            font-size: 1rem;
            text-align: center;
            margin-bottom: 10px;
        }
        @media (max-width: 1100px) {
            .login-form {
                min-width: 0;
                max-width: 96vw;
                padding: 32px 2vw 24px 2vw;
                gap: 18px;
            }
            .login-form h2 {
                font-size: 2.2rem;
                margin-bottom: 18px;
            }
            .login-form label, .login-link {
                font-size: 1.1rem;
            }
            .login-form input {
                font-size: 1.1rem;
                padding: 13px 8px;
            }
            .login-form button {
                font-size: 1.15rem;
                padding: 14px 0;
            }
        }
        @media (max-width: 900px) {
            .login-form {
                min-width: 0;
                max-width: 98vw;
                padding: 22px 4vw 18px 4vw;
            }
            .login-form h2 {
                font-size: 2rem;
            }
            .login-form label, .login-link {
                font-size: 1.1rem;
            }
            .login-form input {
                font-size: 1.1rem;
                padding: 13px 8px;
            }
            .login-form button {
                font-size: 1.15rem;
                padding: 14px 0;
            }
        }
        @media (max-width: 700px) {
            .login-container {
                padding-left: 0;
                justify-content: center;
            }
            .login-form {
                min-width: 0;
                max-width: 98vw;
                padding: 12px 2vw 10px 2vw;
                gap: 8px;
            }
            .login-form h2 {
                font-size: 1.1rem;
                margin-bottom: 6px;
            }
            .login-form label, .login-link {
                font-size: 0.85rem;
            }
            .login-form input {
                font-size: 0.85rem;
                padding: 6px 4px;
            }
            .login-form button {
                font-size: 0.9rem;
                padding: 8px 0;
            }
        }
        @media (max-width: 400px) {
            .login-form {
                padding: 6px 1vw 6px 1vw;
                gap: 4px;
            }
            .login-form h2 {
                font-size: 0.9rem;
            }
            .login-form label, .login-link {
                font-size: 0.7rem;
            }
            .login-form input {
                font-size: 0.7rem;
                padding: 4px 2px;
            }
            .login-form button {
                font-size: 0.7rem;
                padding: 6px 0;
            }
        }
    </style>
</head>
<body>
<div class="login-container">
    <form method="post" class="login-form">
        {% csrf_token %}
        <h2>Iniciar Sesión</h2>
        {% if messages %}
            <div class="login-messages">
                {% for message in messages %}{{ message }}<br>{% endfor %}
            </div>
        {% endif %}
        <div>
            <label for="username">Usuario</label>
            <input type="text" name="username" id="username" class="form-control" required>
        </div>
        <div>
            <label for="password">Contraseña</label>
            <input type="password" name="password" id="password" class="form-control" required>
        </div>
        <button type="submit">Entrar</button>
            </form>
</div>
</body>
</html>
