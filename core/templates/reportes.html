{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Reportes</title>
    <link rel="stylesheet" href="{% static 'styles.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #fff;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        .top-navbar {
            width: 98%;
            background: #e7ebf2;
            box-shadow: 0 2px 8px rgba(40,53,147,0.07);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 32px;
            height: 56px;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 100;
            overflow-x: auto;
        }
        .nav-left {
            display: flex;
            align-items: center;
            gap: 36px;
            flex-wrap: nowrap;
        }
        .nav-link {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #181828;
            font-size: 1.35rem;
            font-weight: 700;
            text-decoration: none;
            padding: 6px 12px;
            border-radius: 10px;
            transition: background 0.18s, color 0.18s;
            white-space: nowrap;
        }
        .nav-link:hover, .nav-link.active {
            background: #d6e4f0;
            color: #1976d2;
        }
        .nav-right {
            display: flex !important;
            align-items: center;
            gap: 16px;
            min-width: 120px;
            justify-content: flex-end;
        }
        .perfil-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #e0f7fa;
            color: #181828;
            font-weight: 700;
            font-size: 1.15rem;
            border-radius: 10px;
            padding: 8px 18px;
            border: none;
            box-shadow: 0 2px 8px rgba(25,118,210,0.07);
            cursor: pointer;
            transition: background 0.18s, color 0.18s;
            text-decoration: none;
        }
        .perfil-btn:hover {
            background: #b2ebf2;
            color: #1976d2;
        }
        .logout-btn {
            display: inline-flex !important;
            align-items: center;
            justify-content: center;
            background: #ede7f6;
            color: #181828;
            border-radius: 10px;
            padding: 8px 14px;
            border: none;
            font-size: 1.2rem;
            box-shadow: 0 2px 8px rgba(25,118,210,0.07);
            cursor: pointer;
            transition: background 0.18s, color 0.18s;
            margin-left: 8px;
            visibility: visible !important;
            opacity: 1 !important;
        }
        .logout-btn i {
            font-size: 1.3rem;
        }
        .logout-btn:hover {
            background: #d1c4e9;
            color: #d32f2f;
        }
        .main-content {
            margin-top: 56px;
            min-height: calc(100vh - 80px);
            padding: 0;
        }
        .footer {
            width: 100%;
            background: #e7ebf2;
            color: #181828;
            text-align: center;
            padding: 16px 0 8px 0;
            font-size: 1.1rem;
            position: fixed;
            bottom: 0;
            left: 0;
        }
        @media (max-width: 900px) {
            .top-navbar { padding: 0 8px; }
            .nav-left { gap: 12px; }
            .nav-link { font-size: 1.05rem; padding: 4px 6px; }
            .perfil-btn, .logout-btn { font-size: 1rem; padding: 6px 8px; }
        }
        @media (max-width: 700px) {
            .top-navbar {
                flex-direction: row;
                height: auto;
                padding: 0 2px;
                overflow-x: auto;
            }
            .nav-left {
                flex-direction: row;
                gap: 4px;
                overflow-x: auto;
                width: 100%;
            }
            .nav-link {
                font-size: 0.98rem;
                padding: 4px 4px;
            }
            .nav-right {
                flex-direction: row;
                gap: 4px;
                min-width: 0;
            }
            .main-content { margin-top: 70px; }
            .reportes-container { padding: 12px 2vw; min-width: unset; max-width: 100vw; }
            .reportes-container h2 { font-size: 1.1rem; }
            canvas { max-width: 100vw !important; height: auto !important; }
        }
        @media (max-width: 480px) {
            .top-navbar { padding: 0 1vw; height: auto; }
            .nav-link { font-size: 0.93rem; padding: 3px 2px; }
            .footer { font-size: 0.95rem; padding: 10px 0 6px 0; }
            .reportes-container { padding: 8px 1vw; max-width: 100vw; }
        }
    </style>
</head>
<body>
    <div class="top-navbar">
        <div class="nav-left">
            <a href="/dashboard/" class="nav-link"><i class="fa-solid fa-house"></i>Inicio</a>
            <a href="/cuaderno/" class="nav-link"><i class="fa-solid fa-tablet-screen-button"></i>Cuaderno</a>
            <a href="/materiales/" class="nav-link"><i class="fa-solid fa-cubes"></i>Materiales</a>
            <a href="/reportes/" class="nav-link"><i class="fa-solid fa-book-open"></i>Reportes</a>
            <a href="/evaluaciones/" class="nav-link"><i class="fa-solid fa-clipboard-list"></i>Evaluaciones</a>
        </div>
        <div class="nav-right">
            <a href="/perfil/" class="perfil-btn"><i class="fa-regular fa-user"></i>Perfil</a>
            <a href="{% url 'landing' %}" class="logout-btn"><i class="fa-solid fa-right-from-bracket"></i></a>
        </div>
    </div>
    <div class="main-content">
        <section class="dashboard-section">
            <div class="reportes-container" style="max-width:900px;margin:40px auto 0 auto;background:#fff;border-radius:18px;box-shadow:0 4px 24px rgba(60,72,88,0.13);padding:44px 38px 36px 38px;border:2.5px solid #1976d2;">
                <h1 style="font-size:2.6rem;font-weight:900;color:#181828;margin-bottom:18px;letter-spacing:1px;">Químicos más usados</h1>
                <form method="get" class="reportes-form" style="display:flex;align-items:center;gap:18px;margin-bottom:24px;flex-wrap:wrap;">
                    <label for="aprendiz" style="font-size:1.15rem;font-weight:700;color:#181828;">Seleccionar aprendiz:</label>
                    <select name="aprendiz" id="aprendiz" onchange="this.form.submit()" style="border-radius:8px;border:2px solid #bfc8d6;background:#f7f9fc;padding:8px 16px;font-size:1.15rem;min-width:180px;box-shadow:0 2px 8px rgba(25,118,210,0.07);">
                        {% if request.user.profile.role == 'aprendiz' %}
                            <option value="{{ request.user.id }}" selected>{{ request.user.username }}</option>
                        {% else %}
                            {% for user in aprendices %}
                                <option value="{{ user.id }}" {% if user.id == aprendiz_id %}selected{% endif %}>{{ user.username }}</option>
                            {% endfor %}
                        {% endif %}
                    </select>
                </form>
                <div style="width:100%;overflow-x:auto;">
                    <canvas id="graficaQuimicos" width="900" height="400" style="background:transparent;"></canvas>
                </div>
                <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
                <script>
                    const pastelColors = [
                        'rgba(178,235,242,0.7)',
                        'rgba(197,202,233,0.7)',
                        'rgba(255,224,130,0.7)',
                        'rgba(197,202,233,0.7)',
                        'rgba(255,224,130,0.7)'
                    ];
                    // Plugin para círculos decorativos
                    const circlesPlugin = {
                        id: 'circlesPlugin',
                        afterDraw: chart => {
                            const ctx = chart.ctx;
                            chart.getDatasetMeta(0).data.forEach((bar, i) => {
                                const color = pastelColors[i % pastelColors.length].replace(',0.7)', ',0.25)');
                                // Dibuja varios círculos en cada barra
                                for (let j = 0; j < 7; j++) {
                                    const radius = 8 + Math.random() * 18;
                                    const x = bar.x - bar.width/2 + Math.random() * bar.width;
                                    const y = bar.y + Math.random() * (chart.chartArea.bottom - bar.y - 20);
                                    ctx.save();
                                    ctx.beginPath();
                                    ctx.arc(x, y, radius, 0, 2 * Math.PI);
                                    ctx.fillStyle = color;
                                    ctx.globalAlpha = 0.35;
                                    ctx.fill();
                                    ctx.restore();
                                }
                            });
                        }
                    };
                    const data = {
                        labels: {{ labels|safe }},
                        datasets: [{
                            label: 'Usos',
                            data: {{ data|safe }},
                            backgroundColor: pastelColors.slice(0, {{ labels|length }}),
                            borderColor: pastelColors.slice(0, {{ labels|length }}),
                            borderWidth: 2,
                            borderRadius: 22,
                            barPercentage: 0.7,
                        }]
                    };
                    const config = {
                        type: 'bar',
                        data: data,
                        options: {
                            plugins: {
                                legend: { display: false },
                            },
                            layout: { padding: 24 },
                            scales: {
                                x: {
                                    grid: { color: '#e3e6ea', lineWidth: 2 },
                                    ticks: {
                                        font: { size: 18, weight: 'bold', family: 'Poppins, Arial, sans-serif' },
                                        color: '#181828',
                                        padding: 8
                                    }
                                },
                                y: {
                                    beginAtZero: true,
                                    grid: { color: '#e3e6ea', lineWidth: 2 },
                                    ticks: {
                                        font: { size: 16, family: 'Poppins, Arial, sans-serif' },
                                        color: '#181828',
                                        padding: 8
                                    }
                                }
                            }
                        },
                        plugins: [circlesPlugin]
                    };
                    new Chart(document.getElementById('graficaQuimicos'), config);
                </script>
                <hr style="margin:40px 0;">
            </div>
        </section>
    </div>
    <footer class="footer">
        Laboratorio Virtual 2025
    </footer>
</body>
</html>
