{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Laboratorio{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'styles.css' %}">
    <!-- Se movieron los estilos al archivo styles.css -->
</head>
<body>
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
            <div class="container-fluid">
                <a class="navbar-brand" href="{% url 'landing' %}">
                    <img src="/static/logo.png" alt="Logo" width="40" height="40" class="d-inline-block align-top">
                   
                </a>
                <!-- ...resto del navbar... -->
            </div>
        </nav>
        <h1>Bienvenido al Laboratorio</h1>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
    <footer class="base-footer">
        Laboratorio Virtual &copy; 2025
    </footer>
</body>
</html>
