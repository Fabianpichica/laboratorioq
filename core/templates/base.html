<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Laboratorio{% endblock %}</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; }
        header { background: #1976d2; color: #fff; padding: 1rem; text-align: center; }
        footer { background: #222; color: #fff; padding: 0.5rem; text-align: center; position: fixed; width: 100%; bottom: 0; }
        main { padding: 2rem; min-height: 80vh; }
    </style>
</head>
<body>
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
            <div class="container-fluid">
                <a class="navbar-brand" href="{% url 'landing' %}">
                    <img src="/static/logo.png" alt="Logo" width="40" height="40" class="d-inline-block align-top">
                   
                </a>
                <!-- ...resto del navbar... -->
            </div>
        </nav>
        <h1>Bienvenido al Laboratorio</h1>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
    <footer style="background: #222; color: #fff; padding: 0.5rem; text-align: center; position: fixed; width: 100%; bottom: 0;">
        Laboratorio Virtual &copy; 2025
    </footer>
</body>
</html>
