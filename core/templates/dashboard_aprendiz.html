{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Dashboard Aprendiz</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #fff;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        .top-navbar {
            width: 98%;
            background: #e7ebf2;
            box-shadow: 0 2px 8px rgba(40,53,147,0.07);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 32px;
            height: 56px;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 100;
            overflow-x: auto;
        }
        .nav-left {
            display: flex;
            align-items: center;
            gap: 36px;
            flex-wrap: nowrap;
        }
        .nav-link {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #181828;
            font-size: 1.35rem;
            font-weight: 700;
            text-decoration: none;
            padding: 6px 12px;
            border-radius: 10px;
            transition: background 0.18s, color 0.18s;
            white-space: nowrap;
        }
        .nav-link:hover, .nav-link.active {
            background: #d6e4f0;
            color: #1976d2;
        }
        .nav-right {
            display: flex !important;
            align-items: center;
            gap: 16px;
            min-width: 120px;
            justify-content: flex-end;
        }
        .perfil-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #e0f7fa;
            color: #181828;
            font-weight: 700;
            font-size: 1.15rem;
            border-radius: 10px;
            padding: 8px 18px;
            border: none;
            box-shadow: 0 2px 8px rgba(25,118,210,0.07);
            cursor: pointer;
            transition: background 0.18s, color 0.18s;
            text-decoration: none;
        }
        .perfil-btn:hover {
            background: #b2ebf2;
            color: #1976d2;
        }
        .logout-btn {
            display: inline-flex !important;
            align-items: center;
            justify-content: center;
            background: #ede7f6;
            color: #181828;
            border-radius: 10px;
            padding: 8px 14px;
            border: none;
            font-size: 1.2rem;
            box-shadow: 0 2px 8px rgba(25,118,210,0.07);
            cursor: pointer;
            transition: background 0.18s, color 0.18s;
            margin-left: 8px;
            visibility: visible !important;
            opacity: 1 !important;
        }
        .logout-btn i {
            font-size: 1.3rem;
        }
        .logout-btn:hover {
            background: #d1c4e9;
            color: #d32f2f;
        }
        .main-content {
            margin-top: 56px;
            min-height: calc(100vh - 80px);
            padding: 0;
        }
        .footer {
            width: 100%;
            background: #e7ebf2;
            color: #181828;
            text-align: center;
            padding: 16px 0 8px 0;
            font-size: 1.1rem;
            position: fixed;
            bottom: 0;
            left: 0;
        }
        @media (max-width: 900px) {
            .top-navbar { padding: 0 8px; }
            .nav-left { gap: 12px; }
            .nav-link { font-size: 1.05rem; padding: 4px 6px; }
            .perfil-btn, .logout-btn { font-size: 1rem; padding: 6px 8px; }
        }
        @media (max-width: 700px) {
            .top-navbar {
                flex-direction: row;
                height: auto;
                padding: 0 2px;
                overflow-x: auto;
            }
            .nav-left {
                flex-direction: row;
                gap: 4px;
                overflow-x: auto;
                width: 100%;
            }
            .nav-link {
                font-size: 0.98rem;
                padding: 4px 4px;
            }
            .nav-right {
                flex-direction: row;
                gap: 4px;
                min-width: 0;
            }
            .main-content { margin-top: 70px; }
        }
        @media (max-width: 480px) {
            .top-navbar { padding: 0 1vw; height: auto; }
            .nav-link { font-size: 0.93rem; padding: 3px 2px; }
            .footer { font-size: 0.95rem; padding: 10px 0 6px 0; }
        }
    </style>
</head>
<body>
    <div class="top-navbar">
        <div class="nav-left">
            <a href="/dashboard/" class="nav-link"><i class="fa-solid fa-house"></i>Inicio</a>
            <a href="/cuaderno/" class="nav-link"><i class="fa-solid fa-tablet-screen-button"></i>Cuaderno</a>
            <a href="/materiales/" class="nav-link"><i class="fa-solid fa-cubes"></i>Materiales</a>
            <a href="/reportes/" class="nav-link"><i class="fa-solid fa-book-open"></i>Reportes</a>
            <a href="/evaluaciones/" class="nav-link"><i class="fa-solid fa-clipboard-list"></i>Evaluaciones</a>
        </div>
        <div class="nav-right">
            <a href="/perfil/" class="perfil-btn"><i class="fa-regular fa-user"></i>Perfil</a>
            <a href="{% url 'landing' %}" class="logout-btn" style="display:inline-flex;"><i class="fa-solid fa-right-from-bracket"></i></a>
        </div>
    </div>
    <div class="main-content">
        <section class="dashboard-section">
            <div class="dashboard-card">
                <h2>Bienvenido, Aprendiz</h2>
                <p>Este es tu dashboard. Selecciona una opción del menú superior para comenzar.</p>
            </div>
        </section>
    </div>
    <footer class="footer">
        Laboratorio Virtual 2025
    </footer>
    <!-- Se eliminó el menú lateral y el menú hamburguesa -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
    <script>
    // Inicializar Select2 en todos los selectores múltiples (puedes copiar esto a editar_profesor.html y registrar_profesor.html)
    $(document).ready(function() {
        $('select[multiple]').select2({
            width: '100%',
            placeholder: 'Selecciona una o varias opciones',
            allowClear: true
        });
    });
    </script>
</body>
</html>
