{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Perfil del Aprendiz</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        html, body { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
        body {
            background: url('{% static "img/perfil_background.png" %}') center center no-repeat;
            background-size: cover;
            min-height: 100vh;
        }
        .top-navbar {
            width: 100%;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(5px);
            box-shadow: 0 2px 8px rgba(40,53,147,0.07);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            height: 56px;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 100;
        }
        .nav-left, .nav-right { display: flex; align-items: center; gap: 16px; }
        .nav-link, .perfil-btn {
            display: flex; align-items: center; gap: 8px; text-decoration: none;
            color: #181828; font-size: 1.1rem; font-weight: 700; padding: 8px 12px; border-radius: 10px;
        }
        .nav-link:hover { background: #d6e4f0; }
        .perfil-btn { background: #e0f7fa; }
        .logout-btn { background: #ede7f6; padding: 8px; border-radius: 10px; color: #181828; }
        .main-content {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            min-height: calc(100vh - 112px); /* Ajustado para nav y footer */
            padding-top: 56px;
            padding-right: 20%;
        }
        .profile-info {
            width: 650px;
        }
        .profile-info h1 {
            text-align: center;
            font-size: 2.4rem;
            font-weight: bold;
            margin-bottom: 30px;
            color: #333;
        }
        .info-item {
            display: flex;
            margin-bottom: 15px;
            font-size: 1.3rem;
            align-items: center;
        }
        .info-label {
            background-color: #c8e6c9;
            padding: 10px 15px;
            border-radius: 10px 0 0 10px;
            font-weight: bold;
            color: #2e7d32;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 120px;
            text-align: center;
        }
        .info-value {
            background-color: #fff;
            padding: 10px 15px;
            border-radius: 0 10px 10px 0;
            flex-grow: 1;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .footer {
            width: 100%;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(5px);
            color: #181828;
            text-align: center;
            padding: 16px 0;
            position: fixed;
            bottom: 0;
            left: 0;
            z-index: 2;
        }
    </style>
</head>
<body>
    <div class="top-navbar">
        <div class="nav-left">
            <a href="/dashboard/" class="nav-link"><i class="fa-solid fa-house"></i>Inicio</a>
            <a href="/cuaderno/" class="nav-link"><i class="fa-solid fa-tablet-screen-button"></i>Cuaderno</a>
            <a href="/materiales/" class="nav-link"><i class="fa-solid fa-cubes"></i>Materiales</a>
            <a href="/reportes/" class="nav-link"><i class="fa-solid fa-book-open"></i>Reportes</a>
            <a href="/evaluaciones/" class="nav-link"><i class="fa-solid fa-clipboard-list"></i>Evaluaciones</a>
        </div>
        <div class="nav-right">
            <a href="/perfil/" class="perfil-btn"><i class="fa-regular fa-user"></i>Perfil</a>
            <a href="{% url 'landing' %}" class="logout-btn"><i class="fa-solid fa-right-from-bracket"></i></a>
        </div>
    </div>
    <div class="main-content">
        <div class="profile-info">
            <h1>Perfil del Aprendiz</h1>
            <div class="info-item">
                <div class="info-label">Usuario:</div>
                <div class="info-value">{{ user.username }}</div>
            </div>
            <div class="info-item">
                <div class="info-label">Email</div>
                <div class="info-value">{{ user.email }}</div>
            </div>
            <div class="info-item">
                <div class="info-label">Rol</div>
                <div class="info-value">{{ profile.role|title }}</div>
            </div>
        </div>
    </div>
    <footer class="footer">
        Laboratorio Virtual 2025
    </footer>
</body>
</html>
