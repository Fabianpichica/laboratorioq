{% extends "dashboard_aprendiz.html" %}
{% block title %}Perfil del Aprendiz{% endblock %}
{% block content %}
<div style="max-width:500px;margin:auto;background:#fff;border:2px solid #1976d2;border-radius:8px;padding:2rem;box-shadow:0 2px 8px rgba(0,0,0,0.08);">
    <h2>Perfil del Aprendiz</h2>
    <p><strong>Usuario:</strong> {{ user.username }}</p>
    <p><strong>Email:</strong> {{ user.email }}</p>
    <p><strong>Rol:</strong> {{ profile.role|title }}</p>
</div>
{% endblock %}
